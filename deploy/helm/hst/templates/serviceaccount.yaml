{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hst.serviceAccountName" . }}
  labels: {{- include "hst.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
# No pod of the release calls the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
