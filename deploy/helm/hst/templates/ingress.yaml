{{- if .Values.ingress.enabled }}
{{- $hosts := fromJsonArray (include "hst.ingressHosts" .) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "hst.fullname" . }}
  labels: {{- include "hst.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    # The TLS entry lists every host of the rules below.
    - hosts: {{ toJson $hosts }}
      secretName: {{ required "ingress.tls.secretName is required when ingress.tls.enabled" .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    {{- range $hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          # The app serves `/api` and the SPA from one origin.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "hst.fullname" $ }}
                port:
                  name: http
    {{- end }}
{{- end }}
