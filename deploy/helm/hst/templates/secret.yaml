{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hst.fullname" . }}
  labels: {{- include "hst.labels" . | nindent 4 }}
type: Opaque
stringData:
  secret-key: {{ required "secrets.secretKey is required (generate one with `hst secret-key`), or set secrets.existingSecret" .Values.secrets.secretKey | quote }}
  neo4j-password: {{ required "secrets.neo4jPassword is required, or set secrets.existingSecret" .Values.secrets.neo4jPassword | quote }}
  postgres-password: {{ required "secrets.postgresPassword is required, or set secrets.existingSecret" .Values.secrets.postgresPassword | quote }}
  {{- if not .Values.postgres.enabled }}
  postgres-dsn: {{ required "postgres.externalDsn is required with postgres.enabled=false, or set secrets.existingSecret" .Values.postgres.externalDsn | quote }}
  {{- end }}
{{- end }}
