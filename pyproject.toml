[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# pysaml2 declares "pyopenssl<24.3.0".
override-dependencies = ["pyopenssl>=26.4"]

[project]
name = "hst"
dynamic = ["version"]
description = "Network digital twin on Neo4j with a layered topology and policy graph across ACI, NX-OS, SD-WAN, Zscaler and firewalls"
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
  "neo4j>=6.4.1",
  "netutils>=1.19.2",
  "ntc-templates>=9.3.0",
  # GHSA-r374-rxx8-8654 has no fix in paramiko 4.x.
  "paramiko>=5.1.0,<6",
  "asyncssh>=2.24.1",
  "pydantic>=2.14.3",
  "pydantic-settings>=2.16.3",
  "httpx>=0.28",
  "httpcore>=1.0.9,<2",  # Public network backend API for HTTPS over SSH jump hosts.
  "typer>=0.29.1",
  "rich>=15.0",
  "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = ["pytest>=9.2.0", "ruff>=0.17.5", "pytest-asyncio>=1.5.0", "mypy>=2.4.1", "pytest-cov>=7.1", "types-PyYAML", "psycopg[binary]>=3.3.9", "pytest-xdist>=3.8"]
# mcp_server.py uses the `MCPServer` API of mcp 2.x.
mcp = ["mcp>=2.3.0,<3"]
sidestore = ["duckdb>=2.0.0", "pyarrow>=26.0.1"]
app = [
  "fastapi>=0.163.0",
  "uvicorn[standard]>=0.54.0",
  "sqlalchemy[asyncio]>=2.1.8",
  "asyncpg>=0.32.0",
  "alembic>=1.20.1",
  "argon2-cffi>=25.1",
  "cryptography>=50.0.2",  # PYSEC-2026-3552 (fixed in 50.0.0)
  "authlib>=1.9.6",
  # The floor has the fix for CVE-2026-26007.
  "pysaml2>=7.5.5",
  # override-dependencies in [tool.uv] has the same bound.
  "pyopenssl>=26.4",
  "strawberry-graphql==0.341.2",
]
# The OpenRouter provider uses `openai`.
agent = [
  "anthropic[bedrock]>=2.12.0",
  "openai>=3.51.0",
]
# dd needs these packages at runtime. `make symbolic-install` installs the dd wheel.
symbolic = [
  "astutils==0.0.6",
  "networkx==3.6.1",
  "ply==3.10",
]

# deploy/Containerfile installs the group `build`.
[dependency-groups]
build = ["hatchling>=1.27"]

[project.scripts]
hst = "hst.cli:main"

[tool.hatch.version]
path = "src/hst/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/hst"]

[tool.pytest.ini_options]
# The pytest plugin of anyio imports _pytest.python.CallSpec2. pytest 9.2 raises a
# PytestRemovedIn10Warning for that import.
addopts = "-q -ra --strict-markers --strict-config -p no:anyio"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "db: requires a reachable Neo4j (set NEO4J_TEST_URI / NEO4J_TEST_PASSWORD)",
  "pg: requires a disposable Postgres (set HST_TEST_PG_DSN)",
  "perf: opt-in fake-fleet benchmark, timing-sensitive (set HST_PERF=1)",
]
asyncio_mode = "auto"
# pytest-asyncio warns at configure time when this is unset.
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/hst"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
show_missing = true
fail_under = 70

[tool.mypy]
files = ["src/hst"]
python_version = "3.13"
ignore_missing_imports = true       # duckdb/ntc-templates ship no stubs
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# The collectors read untyped JSON from the vendor APIs.
module = "hst.collectors.*"
ignore_errors = true

[[tool.mypy.overrides]]
# The SQLAlchemy Row type has no column information.
module = "hst.app.store.pg"
ignore_errors = true

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "ASYNC", "LOG", "G", "C4", "DTZ", "SIM",
          "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
# S603 reports the `git` calls of tests/test_no_run_data.py.
"tests/**" = ["S101", "S105", "S106", "S108", "S311", "S603", "RUF012"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
