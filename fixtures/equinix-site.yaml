# Hand-made Equinix site in the demo shape: an NX-OS core pair with an HSRP gateway and a
# vPC domain, an NX-OS external switch, a Check Point VSX appliance with two virtual
# systems, an ASR pair with a default route and source NAT, and one Equinix Fabric circuit
# stub toward a second site.
#
# Every label, relationship and property here exists in core/labels.py. The member SVIs
# hold the HSRP virtual address with the `fhrp` properties the NX-OS collector writes, the
# FirewallInstance authority equals the scope the management Device loads under (the join
# the legacy trace applies), and the Fabric port realizes the external switch port the
# way the Equinix collector binds it. The Z end at PA3 has no device port here, so the
# reasoner draws no link for the circuit. The scenarios in src/hst/demo.py that read
# this fixture are written against the shape below.
#
# Addressing is documentation and test space only. Nothing here was captured from a device.
#
# Load AFTER fixtures/mini-dc.yaml and fixtures/mini-enterprise.yaml:
#   hst load-fixture fixtures/mini-dc.yaml
#   hst load-fixture fixtures/mini-enterprise.yaml
#   hst load-fixture fixtures/equinix-site.yaml
#   hst validate-demo
