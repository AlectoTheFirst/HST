schema_version: 1
kind: BusinessApplication
id: data-warehouse-production
name: Data Warehouse
description: "Nightly loads from AWS ingest into the Munich warehouse, reporting from Azure."
environment: production
state: draft
services:
  - id: data-warehouse-service
    name: Data Warehouse service
    connection_ids:
      - ingest-to-etl
      - etl-to-db
      - reporting-to-db
    component_roles:
      - group_id: etl
        role: endpoint
groups:
  - id: ingest
    name: AWS ingest
    members:
      - id: dwh-ingest-01
        address: 10.64.11.10
      - id: dwh-ingest-02
        address: 10.64.12.10
  - id: etl
    name: ETL tier
    members:
      - id: dwh-etl-01
        address: 10.2.16.11
      - id: dwh-etl-02
        address: 10.2.16.12
      - id: dwh-etl-03
        address: 10.2.16.13
      - id: dwh-etl-04
        address: 10.2.16.14
      - id: dwh-etl-05
        address: 10.2.16.15
  - id: db
    name: Warehouse database
    members:
      - id: dwh-db-01
        address: 10.2.17.11
      - id: dwh-db-02
        address: 10.2.17.12
      - id: dwh-db-03
        address: 10.2.17.13
  - id: reporting
    name: Azure reporting
    members:
      - id: dwh-report-01
        address: 10.80.1.10
      - id: dwh-report-02
        address: 10.80.1.11
connections:
  - id: ingest-to-etl
    name: AWS ingest to ETL
    source: ingest
    destination: etl
    protocol: tcp
    destination_ports:
      - 8443
    success: session
    destination_condition:
      kind: member
      member: dwh-etl-01
  - id: etl-to-db
    name: ETL to warehouse
    source: etl
    destination: db
    protocol: tcp
    destination_ports:
      - 5439
    success: session
    destination_condition:
      kind: member
      member: dwh-db-01
  - id: reporting-to-db
    name: Azure reporting to warehouse
    source: reporting
    destination: db
    protocol: tcp
    destination_ports:
      - 5439
    success: round-trip
    destination_condition:
      kind: member
      member: dwh-db-01
