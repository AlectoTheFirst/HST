# The sites of the demo estate for the sites table: name, location and map position.
# The codes are the Site codes of estate-v1/v2/v3.yaml. tools/seed_demo.py creates them.
sites:
  - {code: dc1, name: Frankfurt Data Center, location: "Frankfurt am Main, Germany", lat: 50.1109, lon: 8.6821}
  - {code: dc2, name: Munich Data Center, location: "Munich, Germany", lat: 48.1351, lon: 11.582}
  # the named blocks of the FR5 internet routers (tools/gen_demo_enterprise.py FR5_BLOCKS): the demo load
  # writes them on the site it creates, and each run stamps the zone on the router (Device.site_zone)
  - code: eqx-fr5
    name: Equinix FR5
    location: "Frankfurt am Main, Germany"
    lat: 50.1003
    lon: 8.7322
